name: Repository tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check public documentation and ignore boundaries
        run: node scripts/check-repository.mjs
      - name: Test GitHub setup without network or credentials
        run: node --test scripts/github/bootstrap.test.mjs
      - name: Preview project manifest without remote writes
        run: node scripts/github/bootstrap.mjs --dry-run
      - name: Validate development Compose without starting services
        env:
          POSTGRES_PASSWORD: ci-validation-only-not-a-real-secret
        run: docker compose --env-file .env.example -f compose.dev.yml config --quiet
